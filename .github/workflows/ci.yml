name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest contra Postgres real)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pce
          POSTGRES_PASSWORD: pce
          POSTGRES_DB: pce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pce -d pce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://pce:pce@localhost:5432/pce
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        working-directory: backend
        run: pip install -e ".[dev]"

      # alembic upgrade head / downgrade base corren solas vía la fixture de sesión
      # de tests/conftest.py (_schema) — no hace falta un paso de migración aparte.
      - name: Tests
        working-directory: backend
        run: pytest

  frontend:
    name: Frontend (lint, test, build — coe / pmm / api-client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint --workspaces --if-present

      - name: Tests
        working-directory: frontend
        run: npm run test --workspaces --if-present

      - name: Build
        working-directory: frontend
        run: npm run build --workspaces --if-present

  deploy-backend:
    name: Deploy backend a Cloud Run (pce-jorge-chavez)
    needs: backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Autenticar via Workload Identity Federation (sin clave JSON)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/276453531381/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@pce-jorge-chavez.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configurar Docker para Artifact Registry
        run: gcloud auth configure-docker southamerica-west1-docker.pkg.dev --quiet

      - name: Build y push de la imagen
        working-directory: backend
        env:
          IMAGE: southamerica-west1-docker.pkg.dev/pce-jorge-chavez/pce-backend/pce-backend:${{ github.sha }}
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      # alembic upgrade head corre sola al arrancar el contenedor (docker-entrypoint.sh) —
      # no hace falta un paso de migracion aparte acá tampoco.
      - name: Desplegar a Cloud Run
        env:
          IMAGE: southamerica-west1-docker.pkg.dev/pce-jorge-chavez/pce-backend/pce-backend:${{ github.sha }}
        run: |
          gcloud run deploy pce-backend \
            --image="$IMAGE" \
            --region=southamerica-west1 \
            --project=pce-jorge-chavez \
            --quiet

  deploy-frontend:
    name: Deploy frontend a Firebase Hosting (coe + pmm)
    needs: frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Build de producción (coe + pmm)
        working-directory: frontend
        run: npm run build --workspaces --if-present

      - id: auth
        name: Autenticar via Workload Identity Federation (sin clave JSON)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/276453531381/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@pce-jorge-chavez.iam.gserviceaccount.com

      - name: Desplegar a Firebase Hosting
        working-directory: frontend
        run: npx firebase-tools deploy --only hosting --project pce-jorge-chavez --non-interactive

  docker-compose:
    name: docker-compose (smoke test contra un deploy limpio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Levantar el stack
        run: |
          cp .env.example .env
          docker compose up -d --build

      # Hallazgo real (2026-08-16): sin el entrypoint que corre `alembic upgrade
      # head` (backend/docker-entrypoint.sh), este paso fallaba — el contenedor
      # arrancaba contra una base sin tablas y el lifespan de app/main.py crasheaba.
      - name: Esperar a que el backend responda
        run: timeout 60 bash -c 'until curl -sf http://localhost:8000/salud; do sleep 2; done'

      - name: Logs si algo falla
        if: failure()
        run: docker compose logs

      - name: Bajar el stack
        if: always()
        run: docker compose down -v
