[project]
name = "pce-backend"
version = "0.1.0"
description = "Backend del PCE (Puesto de Comando y Administración de Emergencias) — SSEI AIJC"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyjwt>=2.9",
    "passlib[bcrypt]>=1.7",
    # passlib 1.7.4 (última versión, sin releases desde 2020) hace un self-test interno
    # con un password > 72 bytes; bcrypt >=4.0 empezo a rechazar eso con ValueError en
    # vez de truncar en silencio, rompiendo el arranque del backend. Fijado hasta que
    # se migre a una librería de hashing mantenida.
    "bcrypt<4.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
